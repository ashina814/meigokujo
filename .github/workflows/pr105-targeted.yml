name: PR105 Targeted Validation

on:
  push:
    branches: ["feat/pr19-5-casino-opening-ops"]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted R3 fail-closed tests
        run: pnpm --dir apps/bot exec vitest run tests/casino-opening-external-failclosed.test.ts tests/casino-opening-ops-followup.test.ts tests/casino-opening-ops.test.ts
