name: PR19 audit fixture hotfix
on:
  push:
    branches: [feat/pr19-casino-metrics]
    paths: [.github/workflows/pr19-audit-fixture-hotfix.yml]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix durable ledger fixture in validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr19-audit-fix-fixtures.yml')
          s = p.read_text()
          old = '''    const deposit = ctx.db.prepare(`\\n      INSERT INTO casino_tx\\n        (group_key, seq, tx_kind, from_holder, to_holder, amount, reason, game, session_id, actor_id,\\n         opening_version, land_amount, ledger_tx_id, created_at)\\n      VALUES ('deposit:old', 1, 'deposit', NULL, 'alice', 100, 'old', NULL, NULL, 'alice', ?, 100, 1, ?)\\n    `).run(FORMAL_OPENING_VERSION, START);\\n    const txId = Number(deposit.lastInsertRowid);\\n    ctx.metrics.record({ eventKey: `chip_deposit:tx:${txId}`, eventType: "chip_deposit", userId: "alice", amount: 100, occurredAt: START });'''
          new = '''    ctx.ledger.ensureAccount("user:alice", "user");\\n    ctx.ledger.ensureAccount("sys:casino:test-pool", "system");\\n    ctx.ledger.transfer({\\n      from: "sys:treasury",\\n      to: "user:alice",\\n      amount: 100,\\n      type: "opening",\\n      actor: "test",\\n      idempotencyKey: "metric-test-fund",\\n    });\\n    const landTx = ctx.ledger.transfer({\\n      from: "user:alice",\\n      to: "sys:casino:test-pool",\\n      amount: 100,\\n      type: "chip_deposit",\\n      actor: "alice",\\n      idempotencyKey: "metric-test-old-deposit",\\n    }).tx.id;\\n    const deposit = ctx.db.prepare(`\\n      INSERT INTO casino_tx\\n        (group_key, seq, tx_kind, from_holder, to_holder, amount, reason, game, session_id, actor_id,\\n         opening_version, land_amount, ledger_tx_id, created_at)\\n      VALUES ('deposit:old', 1, 'deposit', NULL, 'alice', 100, 'old', NULL, NULL, 'alice', ?, 100, ?, ?)\\n    `).run(FORMAL_OPENING_VERSION, landTx, START);\\n    const txId = Number(deposit.lastInsertRowid);\\n    ctx.metrics.record({ eventKey: `chip_deposit:tx:${txId}`, eventType: "chip_deposit", userId: "alice", amount: 100, occurredAt: START });'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one fixture snippet, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/pr19-audit-fixture-hotfix.yml
          git config user.name "ashina"
          git config user.email "tajitajifj0133@gmail.com"
          git add -A
          git commit -m "fix PR19 audit fixture ledger reference"
          git push origin HEAD:feat/pr19-casino-metrics
