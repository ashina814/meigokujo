name: PR10 audit validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit patch
        run: |
          cat .audit/parts/0* | base64 -d | gzip -d > /tmp/pr10.patch
          git apply --check /tmp/pr10.patch
          git apply /tmp/pr10.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Core PR10 targets
        run: |
          pnpm --filter @meigokujo/core exec vitest run \
            tests/casino-chip-flow.test.ts \
            tests/casino-chip-flow-rebuild.test.ts \
            tests/casino-recovery-chip-flow.test.ts \
            tests/casino-recovery.test.ts \
            tests/casino-integrity-assets.test.ts \
            tests/chip-assets-scope.test.ts \
            tests/chip-assets-free-holder.test.ts
      - name: Bot PR10 targets
        run: |
          pnpm --filter @meigokujo/bot exec vitest run \
            tests/casino-auto-chip-flow.test.ts \
            tests/casino-known-bugs.test.ts \
            tests/casino-opening-reset.test.ts \
            tests/casino-opening-ui.test.ts
