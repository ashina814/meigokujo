name: PR10 audit validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit patch
        run: |
          base64 -d .audit/pr10.patch.gz.b64 | gzip -d > /tmp/pr10.patch
          git apply --check /tmp/pr10.patch
          git apply /tmp/pr10.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
