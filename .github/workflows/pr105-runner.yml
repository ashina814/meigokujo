name: PR105 Runner
on:
  push:
    branches:
      - feat/pr19-5-casino-opening-ops
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: trigger PR105 runner' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr19-5-casino-opening-ops
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract and apply patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/pr105-followup.yml | sed '1d;$d;s/^          //' > /tmp/pr105-followup.py
          python /tmp/pr105-followup.py
      - name: Typecheck
        run: |
          pnpm --filter @meigokujo/core typecheck
          pnpm --filter @meigokujo/bot typecheck
      - name: Targeted tests
        run: |
          pnpm --filter @meigokujo/core exec vitest run tests/casino-opening-backup.test.ts tests/casino-opening-production-backup-followup.test.ts tests/casino-opening-reset.test.ts tests/casino-opening-plan.test.ts
          pnpm --filter @meigokujo/bot exec vitest run tests/casino-opening-ops.test.ts tests/casino-opening-ops-followup.test.ts tests/casino-opening-ui.test.ts tests/casino-opening-reset.test.ts
      - name: Commit validated follow-up
        run: |
          git config user.name ashina
          git config user.email tajitajifj0133@gmail.com
          git add apps/bot/src/casino/opening-ops.ts apps/bot/tests/casino-opening-ops.test.ts apps/bot/tests/casino-opening-ops-followup.test.ts packages/core/src/casino/opening-backup.ts packages/core/tests/casino-opening-backup.test.ts packages/core/tests/casino-opening-production-backup-followup.test.ts
          git diff --cached --check
          git commit -m "fix PR19.5 opening operation blockers"
          git push origin HEAD:feat/pr19-5-casino-opening-ops
