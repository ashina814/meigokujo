name: Temporary Casino Test Migration

on:
  push:
    branches: ["feat/casino-chip-ledger"]
    paths: [".github/workflows/tmp-casino-test-migration.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casino-chip-ledger
          fetch-depth: 0
      - name: Migrate test fixtures to ChipLedger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('packages/core/tests'), Path('apps/bot/tests')]
          changed = []
          for root in roots:
              for path in root.rglob('*.ts'):
                  text = path.read_text(encoding='utf-8')
                  if 'EtherExchange' not in text:
                      continue
                  updated = text.replace('EtherExchange', 'ChipLedger')
                  updated = re.sub(
                      r'\{\s*baseRate:\s*(?:\(\)\s*=>\s*)?1\s*,\s*chipTx\s*\}',
                      '{ chipTx }',
                      updated,
                  )
                  updated = re.sub(
                      r'\{\s*chipTx\s*,\s*baseRate:\s*(?:\(\)\s*=>\s*)?1\s*\}',
                      '{ chipTx }',
                      updated,
                  )
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          remaining = []
          for root in roots:
              for path in root.rglob('*.ts'):
                  if 'EtherExchange' in path.read_text(encoding='utf-8'):
                      remaining.append(str(path))
          if remaining:
              raise SystemExit('legacy test references remain: ' + ', '.join(remaining))
          if not changed:
              raise SystemExit('no legacy test fixtures found')
          print('\n'.join(changed))
          PY
          git rm .github/workflows/tmp-casino-test-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/tests apps/bot/tests
          git commit -m "test(casino): migrate fixtures to ChipLedger"
          git push origin HEAD:feat/casino-chip-ledger
