name: Apply PR13 Chinchiro Text Cleanup

on:
  push:
    branches: ["feat/casino-land-scale"]
    paths: [".github/workflows/fix-pr13-chinchiro-text.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casino-land-scale
          fetch-depth: 0
      - name: Replace legacy display text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/bot/src/casino/chinchiro.ts')
          text = path.read_text(encoding='utf-8')
          changed = text.replace('replace(" ◈", "◈")', 'replace(" Ld", "Ld")').replace(' 奉納`', ' 福分け積立`')
          if changed == text:
              raise SystemExit('expected PR13 text was not found')
          path.write_text(changed, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/casino/chinchiro.ts
          git commit -m "fix(casino): restore Land-era chinchiro terminology"
          git push origin HEAD:feat/casino-land-scale
