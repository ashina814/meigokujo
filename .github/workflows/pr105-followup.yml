name: PR105 follow-up patch
on:
  push:
    branches: [feat/pr19-5-casino-opening-ops]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.event.head_commit.message == 'chore: run PR105 follow-up patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr19-5-casino-opening-ops
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply surgical PR105 blocker fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

