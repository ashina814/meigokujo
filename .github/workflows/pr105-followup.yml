          Path('packages/core/tests/casino-opening-production-backup-followup.test.ts').write_text(r'''import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, unlinkSync, writeFileSync } from "node:fs";
import { join } from "node:path";
import { afterEach, describe, expect, it } from "vitest";
import { openDb } from "../src/db/bootstrap.js";
import { Ledger, TREASURY } from "../src/ledger/service.js";
import { registerDefaultTxTypes } from "../src/ledger/registry.js";
import { ProductionOpeningBackupAdapter } from "../src/casino/opening-backup.js";

registerDefaultTxTypes();

const roots: string[] = [];
afterEach(() => {
  for (const root of roots.splice(0)) rmSync(root, { recursive: true, force: true });
});

function rootDir(): string {
  const root = mkdtempSync(join(process.cwd(), "pr105-backup-followup-"));
  roots.push(root);
  return root;
}

function setup() {
  const db = openDb(":memory:");
  const ledger = new Ledger(db);
  ledger.ensureAccount("user:alice", "user");
  ledger.transfer({ from: TREASURY, to: "user:alice", amount: 1000, type: "initial", actor: "test", idempotencyKey: "seed" });
  db.exec("CREATE TABLE IF NOT EXISTS ether_balances (user_id TEXT PRIMARY KEY, amount INTEGER NOT NULL DEFAULT 0, updated_at INTEGER NOT NULL)");
  db.prepare("INSERT INTO ether_balances (user_id, amount, updated_at) VALUES ('house', 500, 0)").run();
  return { db, ledger };
}

function request(db: ReturnType<typeof setup>["db"], planHash: string) {
  return { db, planHash, archiveTables: ["accounts", "ether_balances"], openingVersion: "legacy_pre_reset" } as const;
}

function finalDir(root: string, planHash: string): string {
  return join(root, `casino-opening-${planHash}`);
}

function orphanStage(root: string, planHash: string, files: string[]): string {
  const stage = join(root, `.casino-opening-${planHash}.staging-crash`);
  mkdirSync(stage, { mode: 0o700 });
  for (const file of files) writeFileSync(join(stage, file), `orphan:${file}`, { mode: 0o600 });
  return stage;
}

describe("ProductionOpeningBackupAdapter atomic directory publish", () => {
  it.each([
    ["sqlite作成後crash", ["snapshot.sqlite"]],
    ["CSV途中crash", ["snapshot.sqlite", "accounts.csv"]],
    ["manifest作成前crash", ["snapshot.sqlite", "accounts.csv", "ether_balances.csv"]],
    ["publish直前crash", ["snapshot.sqlite", "accounts.csv", "ether_balances.csv", "manifest.json"]],
  ] as const)("%s のstagingをcompleted扱いせず、retryで安全にpublishする", async (_name, files) => {
    const root = rootDir();
    const { db } = setup();
    const planHash = `crash-${files.length}`;
    const stage = orphanStage(root, planHash, [...files]);
    const adapter = new ProductionOpeningBackupAdapter(root);

    const manifest = await adapter.backup(request(db, planHash));

    expect(existsSync(stage)).toBe(true);
    const published = finalDir(root, planHash);
    expect(existsSync(join(published, "snapshot.sqlite"))).toBe(true);
    expect(existsSync(join(published, "accounts.csv"))).toBe(true);
    expect(existsSync(join(published, "ether_balances.csv"))).toBe(true);
    expect(JSON.parse(readFileSync(join(published, "manifest.json"), "utf8"))).toEqual(manifest);
  });

  it("publish後の再実行はsame-plan/same-content backupを再利用する", async () => {
    const root = rootDir();
    const { db } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    const first = await adapter.backup(request(db, "replay"));
    const second = await adapter.backup(request(db, "replay"));
    expect(second).toEqual(first);
  });

  it("same plan different contentはconflictでfail-closed", async () => {
    const root = rootDir();
    const { db, ledger } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    await adapter.backup(request(db, "conflict"));
    ledger.transfer({ from: TREASURY, to: "user:alice", amount: 1, type: "initial", actor: "test", idempotencyKey: "changed" });
    await expect(adapter.backup(request(db, "conflict"))).rejects.toThrow(/conflict/);
  });

  it("final manifest破損を検出する", async () => {
    const root = rootDir();
    const { db } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    await adapter.backup(request(db, "bad-manifest"));
    writeFileSync(join(finalDir(root, "bad-manifest"), "manifest.json"), "{broken", "utf8");
    await expect(adapter.backup(request(db, "bad-manifest"))).rejects.toThrow(/manifest is corrupt/);
  });

  it("final sqlite破損を検出する", async () => {
    const root = rootDir();
    const { db } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    await adapter.backup(request(db, "bad-sqlite"));
    writeFileSync(join(finalDir(root, "bad-sqlite"), "snapshot.sqlite"), "corrupt", "utf8");
    await expect(adapter.backup(request(db, "bad-sqlite"))).rejects.toThrow(/incomplete or corrupt/);
  });

  it("final CSV破損を検出する", async () => {
    const root = rootDir();
    const { db } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    await adapter.backup(request(db, "bad-csv"));
    writeFileSync(join(finalDir(root, "bad-csv"), "ether_balances.csv"), "corrupt", "utf8");
    await expect(adapter.backup(request(db, "bad-csv"))).rejects.toThrow(/incomplete or corrupt/);
  });

  it("final file欠損を検出する", async () => {
    const root = rootDir();
    const { db } = setup();
    const adapter = new ProductionOpeningBackupAdapter(root);
    await adapter.backup(request(db, "missing"));
    unlinkSync(join(finalDir(root, "missing"), "accounts.csv"));
    await expect(adapter.backup(request(db, "missing"))).rejects.toThrow(/incomplete or corrupt/);
  });
});
''')

