name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment shell syntax
        run: bash -n deploy/deploy.sh deploy/backup.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + bot)
        run: pnpm typecheck

      - name: Core backup targeted
        run: pnpm --filter @meigokujo/core exec vitest run tests/casino-opening-backup.test.ts tests/casino-opening-production-backup-followup.test.ts

      - name: Core reset targeted
        run: pnpm --filter @meigokujo/core exec vitest run tests/casino-opening-reset.test.ts tests/casino-opening-plan.test.ts

      - name: Bot opening ops existing
        run: pnpm --filter @meigokujo/bot exec vitest run tests/casino-opening-ops.test.ts

      - name: Bot opening ops followup
        run: pnpm --filter @meigokujo/bot exec vitest run tests/casino-opening-ops-followup.test.ts

      - name: Bot opening UI/reset targeted
        run: pnpm --filter @meigokujo/bot exec vitest run tests/casino-opening-ui.test.ts tests/casino-opening-reset.test.ts
