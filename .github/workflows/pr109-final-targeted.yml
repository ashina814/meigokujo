name: PR109 Final Targeted Verification

on:
  push:
    branches:
      - feat/pr22-casino-disputes

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr22-casino-disputes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add deterministic evidence/deadline race order coverage
        run: python .github/scripts/pr109-add-race-order-tests.py
      - name: Typecheck
        run: pnpm typecheck
      - name: Core dispute targeted normal
        run: pnpm --filter @meigokujo/core exec vitest run tests/casino-ranked-disputes.test.ts tests/casino-ranked-disputes-final.test.ts
      - name: Core dispute separate-process targeted serial
        run: pnpm --filter @meigokujo/core exec vitest run --config vitest.serial.config.ts tests/casino-ranked-disputes-concurrency.serial.test.ts tests/casino-ranked-disputes-final-concurrency.serial.test.ts
      - name: Bot message/startup targeted
        run: pnpm --filter @meigokujo/bot exec vitest run tests/casino-ranked-table-ui.test.ts tests/casino-ranked-message-sync-final.test.ts tests/casino-ranked-message-sync-startup.test.ts tests/casino-persistent-table-recovery.test.ts tests/casino-arbitration.test.ts
      - name: Commit tested final review coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr109-final-targeted.yml .github/scripts/pr109-add-race-order-tests.py
          git add packages/core/tests/casino-ranked-disputes-final-concurrency.serial.test.ts
          git commit -m "test PR22 both evidence deadline race orderings"
          git push origin HEAD:feat/pr22-casino-disputes
