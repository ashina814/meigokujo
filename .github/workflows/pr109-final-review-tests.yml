name: PR109 Final Review Tests Apply

on:
  push:
    branches:
      - feat/pr22-casino-disputes

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr22-casino-disputes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add final-review regression coverage
        run: python .github/scripts/pr109-final-review-tests.py
      - name: Typecheck
        run: pnpm typecheck
      - name: Targeted core normal
        run: pnpm --filter @meigokujo/core exec vitest run tests/casino-ranked-disputes-final.test.ts
      - name: Targeted core cross-process serial
        run: pnpm --filter @meigokujo/core exec vitest run --config vitest.serial.config.ts tests/casino-ranked-disputes-final-concurrency.serial.test.ts
      - name: Targeted bot
        run: pnpm --filter @meigokujo/bot exec vitest run tests/casino-ranked-message-sync-final.test.ts tests/casino-ranked-table-ui.test.ts
      - name: Commit tested regression coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr109-final-review-tests.yml .github/scripts/pr109-final-review-tests.py
          git add apps/bot/tests/casino-ranked-table-ui.test.ts apps/bot/tests/casino-ranked-message-sync-final.test.ts packages/core/tests/casino-ranked-disputes-final.test.ts packages/core/tests/casino-ranked-disputes-final-concurrency.serial.test.ts packages/core/tests/helpers/ranked-dispute-final-runner.ts
          git commit -m "test PR22 final review dispute invariants"
          git push origin HEAD:feat/pr22-casino-disputes
