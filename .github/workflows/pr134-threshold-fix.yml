name: PR134 threshold fix

on:
  push:
    branches: [agent/original-role-service-and-purchase-log]

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/original-role-service-and-purchase-log
          fetch-depth: 0

      - name: Apply threshold fix
        run: |
          cp tools/pr134-threshold-fix.py /tmp/pr134-threshold-fix.py
          python /tmp/pr134-threshold-fix.py
          grep -n "ERR_INVOICE_NEEDS_APPROVAL\|approval_threshold\|請求は作成していません" packages/core/src/original-role/cases.ts apps/bot/src/commands/original-role-ticket.ts

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Targeted tests
        run: |
          pnpm --filter @meigokujo/core exec vitest run tests/original-role-service-case.test.ts
          pnpm --filter @meigokujo/bot exec vitest run tests/original-role-service-policy.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Full tests
        run: pnpm -r test

      - name: Commit verified fix
        run: |
          rm -f .github/workflows/pr134-threshold-fix.yml tools/pr134-threshold-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(shop): reject unpayable original-role invoices" \
            -m "Block invoice issuance above the live Land approval threshold while preserving the existing payment-time approval defense."
          git push origin HEAD:agent/original-role-service-and-purchase-log
