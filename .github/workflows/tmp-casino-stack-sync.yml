name: Temporary Casino Stack Sync

on:
  push:
    branches: ["feat/casino-land-scale"]
    paths: [".github/workflows/tmp-casino-stack-sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casino-land-scale
          fetch-depth: 0
      - name: Merge latest PR12 into PR13 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/casino-opening-reset
          git merge --no-ff origin/feat/casino-opening-reset -m "chore: sync PR12 into PR13"
          git rm .github/workflows/tmp-casino-stack-sync.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/casino-land-scale
