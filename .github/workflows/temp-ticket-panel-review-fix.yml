name: Temporary ticket panel review fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  apply:
    if: >-
      github.event.issue.number == 11 &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/apply-ticket-panel-review-fix-9c4e11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-panel-lifecycle
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply review fixes and validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/ticket-panel-review-fix.log
          {
            set -euo pipefail
            python .github/scripts/ticket_panel_lifecycle_review_fix.py
            rm -f .github/scripts/ticket_panel_lifecycle_review_fix.py
            rm -f .github/TICKET_PANEL_REVIEW_FIX_FAILURE.log
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm --filter @meigokujo/core test -- tests/vc-tickets.test.ts
            pnpm --filter @meigokujo/bot test
            pnpm -r test
            git diff --check
          } 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$rc" -ne 0 ]; then
            git reset --hard HEAD
            cp "$LOG" .github/TICKET_PANEL_REVIEW_FIX_FAILURE.log
            git add .github/TICKET_PANEL_REVIEW_FIX_FAILURE.log
            git commit -m "Record ticket panel review fix failure"
            git push origin HEAD:agent/ticket-panel-lifecycle
            exit "$rc"
          fi

          git add -A
          git commit -m "Harden ticket panel lifecycle failure handling"
          git push origin HEAD:agent/ticket-panel-lifecycle
