name: PR132 evaluation picker fix v3

on:
  push:
    branches:
      - fix/evaluation-picker-membership

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evaluation-picker-membership
          fetch-depth: 0

      - name: Apply evaluation picker usability fix
        shell: bash
        run: |
          python <<'EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/pr132-evaluation-picker-fix-v2.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('could not find patch script start')
          body = workflow.split(start_marker, 1)[1]
          if end_marker not in body:
              raise SystemExit('could not find patch script end')
          body = body.split(end_marker, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines()) + "\n"
          Path('/tmp/apply-evaluation-picker.py').write_text(script)
          EXTRACT
          python /tmp/apply-evaluation-picker.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "ashina814"
          git config user.email "233315635+ashina814@users.noreply.github.com"
          git rm .github/workflows/pr132-evaluation-picker-fix-v2.yml .github/workflows/pr132-evaluation-picker-fix-v3.yml
          git add apps/bot/src/commands/evaluation.ts apps/bot/src/index.ts apps/bot/tests/evaluation-picker-membership.test.ts
          git commit -m "fix: 評価対象を在籍中の亡霊だけに絞る"
          git push origin HEAD:fix/evaluation-picker-membership
