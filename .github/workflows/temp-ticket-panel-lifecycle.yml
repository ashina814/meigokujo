name: Temporary ticket panel lifecycle patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  apply:
    if: >-
      github.event.issue.number == 11 &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/apply-ticket-panel-lifecycle-7f3c2a'
    runs-on: ubuntu-latest
    steps:
      - name: Check out lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: agent/ticket-panel-lifecycle
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply, validate, and publish
        shell: bash
        run: |
          set +e
          LOG=/tmp/ticket-panel-lifecycle.log
          {
            set -euo pipefail

            python - <<'PY'
          from pathlib import Path

          helpers = [
              Path('.github/scripts/ticket_panel_lifecycle_core.py'),
              Path('.github/scripts/ticket_panel_lifecycle_admin_routes.py'),
              Path('.github/scripts/ticket_panel_lifecycle_admin_ui.py'),
              Path('.github/scripts/ticket_panel_lifecycle_admin_actions.py'),
          ]
          old = 'new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          for helper in helpers:
              text = helper.read_text()
              if old in text:
                  text = text.replace(old, new)
              helper.write_text(text)

          routes = Path('.github/scripts/ticket_panel_lifecycle_admin_routes.py')
          text = routes.read_text()
          text = text.replace(r'? `\n⚠️ ${warning}` : ""', r'? `\\n⚠️ ${warning}` : ""')
          text = text.replace(
              'await fetched.message.edit(ticketPanelMessageForPanel(panel)).catch(() => { warning = "設置済みメッセージの表示更新に失敗しました。再設置してください。"; });',
              'const rendered = ticketPanelMessageForPanel(panel);\n            await fetched.message.edit({ embeds: rendered.embeds, components: rendered.components }).catch(() => { warning = "設置済みメッセージの表示更新に失敗しました。再設置してください。"; });',
          )
          routes.write_text(text)

          actions = Path('.github/scripts/ticket_panel_lifecycle_admin_actions.py')
          text = actions.read_text()
          marker = 'async function detachTicketPanelMessage(interaction: ButtonInteraction, services: Services, panel: TicketPanel, actor: string): Promise<{ warning: string; forcedDisabled: boolean }> {'
          compatibility = r'''export async function disableTicketPanel(
            interaction: StringSelectMenuInteraction,
            services: Services,
            panelId: string,
          ): Promise<void> {
            const panel = services.tickets.disablePanel(panelId, `user:${interaction.user.id}`);
            if (!panel) {
              await interaction.update({ content: "❌ 受付が見つかりません。", embeds: [], components: [backButton()] });
              return;
            }
            let warning = "";
            if (panel.channelId && panel.messageId) {
              const channel = await interaction.client.channels.fetch(panel.channelId).catch(() => null);
              if (channel?.isTextBased() && "messages" in channel) {
                const fetched = await fetchPanelMessage(channel, panel.messageId);
                if (fetched.ok && fetched.message) {
                  const rendered = ticketPanelMessageForPanel(panel);
                  await fetched.message.edit({ embeds: rendered.embeds, components: rendered.components }).catch(() => {
                    warning = "設置済みパネルの無効表示への更新に失敗しました。";
                  });
                } else if (fetched.ok) warning = "設置済みパネルのメッセージが見つかりませんでした。";
                else warning = "設置済みパネルの取得に失敗しました。";
              } else warning = "設置済みパネルのチャンネルが見つかりません。";
            }
            await interaction.update({ content: `🛑 「${panel.name}」を無効化しました。既存チケットは残ります。${warning ? `\n⚠️ ${warning}` : ""}`, embeds: [], components: [backButton()] });
          }

          '''
          if marker not in text:
              raise RuntimeError('compatibility insertion marker not found')
          text = text.replace(marker, compatibility + marker, 1)
          actions.write_text(text)
          PY

            python .github/scripts/ticket_panel_lifecycle_core.py
            python .github/scripts/ticket_panel_lifecycle_admin_routes.py
            python .github/scripts/ticket_panel_lifecycle_admin_ui.py
            python .github/scripts/ticket_panel_lifecycle_admin_actions.py
            python .github/scripts/ticket_panel_lifecycle_tests.py

            rm -f .github/scripts/ticket_panel_lifecycle_core.py
            rm -f .github/scripts/ticket_panel_lifecycle_admin_routes.py
            rm -f .github/scripts/ticket_panel_lifecycle_admin_ui.py
            rm -f .github/scripts/ticket_panel_lifecycle_admin_actions.py
            rm -f .github/scripts/ticket_panel_lifecycle_tests.py
            rm -f .github/workflows/ticket-panel-lifecycle-autofix.yml
            rm -f .github/TICKET_PANEL_PATCH_FAILURE.log

            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm --filter @meigokujo/core test -- tests/vc-tickets.test.ts
            pnpm --filter @meigokujo/bot test
            pnpm -r test
            git diff --check
          } 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$rc" -ne 0 ]; then
            git reset --hard HEAD
            cp "$LOG" .github/TICKET_PANEL_PATCH_FAILURE.log
            git add .github/TICKET_PANEL_PATCH_FAILURE.log
            git commit -m "Record ticket panel lifecycle patch failure"
            git push origin HEAD:agent/ticket-panel-lifecycle
            exit "$rc"
          fi

          git add -A
          git commit -m "Complete ticket panel lifecycle controls"
          git push origin HEAD:agent/ticket-panel-lifecycle
