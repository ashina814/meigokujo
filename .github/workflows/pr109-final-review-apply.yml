name: PR109 Final Review Apply

on:
  push:
    branches:
      - feat/pr22-casino-disputes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr22-casino-disputes
          fetch-depth: 0
      - name: Apply PR22 final review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch target in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # core: durable public-message sync outbox + pre-start deadline semantics + public receipts
          path = "packages/core/src/casino/ranked-disputes.ts"
          rep(path,
          '''  | "ERR_DISPUTE_RESOLUTION_CONFLICT"\n  | "ERR_DISPUTE_INSUFFICIENT_EVIDENCE"\n  | "ERR_DISPUTE_FEE_RESERVATION"''',
          '''  | "ERR_DISPUTE_RESOLUTION_CONFLICT"\n  | "ERR_DISPUTE_INSUFFICIENT_EVIDENCE"\n  | "ERR_DISPUTE_PRE_START_RESULT"\n  | "ERR_DISPUTE_FEE_RESERVATION"''')

          rep(path,
          '''export interface RankedDisputePublicStatus {\n  tableId: string;\n  evidenceDeadlineAt: number;\n  evidenceClosedAt: number | null;''',
          '''export interface RankedRefundReceipt {\n  userId: string;\n  amount: number;\n}\n\nexport interface RankedMessageSyncPending {\n  tableId: string;\n  requestedAt: number;\n  attempts: number;\n  lastAttemptAt: number | null;\n  lastError: string | null;\n}\n\nexport interface RankedDisputePublicStatus {\n  tableId: string;\n  evidenceDeadlineAt: number;\n  evidenceClosedAt: number | null;\n  preStart: boolean;\n  refundAmounts: RankedRefundReceipt[] | null;''')

          rep(path,
          '''  ensureSchemaForTesting(): void {\n    this.ensureSchema();\n  }\n\n  openForTable''',
          '''  ensureSchemaForTesting(): void {\n    this.ensureSchema();\n  }\n\n  listMessageSyncPending(limit = 100): RankedMessageSyncPending[] {\n    if (this.openingPhase() !== "formal") return [];\n    this.ensureSchema();\n    const safeLimit = Number.isSafeInteger(limit) && limit > 0 ? Math.min(limit, 500) : 100;\n    const rows = this.db\n      .prepare(\n        `SELECT table_id, requested_at, attempts, last_attempt_at, last_error\n           FROM casino_table_message_sync_outbox\n          ORDER BY requested_at, table_id\n          LIMIT ?`,\n      )\n      .all(safeLimit) as Array<{\n        table_id: string;\n        requested_at: number;\n        attempts: number;\n        last_attempt_at: number | null;\n        last_error: string | null;\n      }>;\n    return rows.map((row) => ({\n      tableId: row.table_id,\n      requestedAt: row.requested_at,\n      attempts: row.attempts,\n      lastAttemptAt: row.last_attempt_at,\n      lastError: row.last_error,\n    }));\n  }\n\n  markMessageSyncSucceeded(tableId: string): void {\n    if (this.openingPhase() !== "formal") return;\n    this.ensureSchema();\n    this.db.prepare("DELETE FROM casino_table_message_sync_outbox WHERE table_id=?").run(requiredString(tableId, "tableId"));\n  }\n\n  markMessageSyncFailed(tableId: string, error: unknown): void {\n    if (this.openingPhase() !== "formal") return;\n    this.ensureSchema();\n    const safeTableId = requiredString(tableId, "tableId");\n    const now = this.now();\n    const message = truncate(error instanceof Error ? error.message : String(error), 500);\n    this.db\n      .prepare(\n        `INSERT INTO casino_table_message_sync_outbox\n           (table_id, requested_at, attempts, last_attempt_at, last_error)\n         VALUES (?, ?, 1, ?, ?)\n         ON CONFLICT(table_id) DO UPDATE SET\n           attempts=casino_table_message_sync_outbox.attempts+1,\n           last_attempt_at=excluded.last_attempt_at,\n           last_error=excluded.last_error`,\n      )\n      .run(safeTableId, now, now, message);\n  }\n\n  openForTable''')

          rep(path,
          '''          storage.result_submitted_at,\n        );\n      return this.publicStatus(table.tableId)!;''',
          '''          storage.result_submitted_at,\n        );\n      this.queueMessageSync(table.tableId);\n      return this.publicStatus(table.tableId)!;''')

          rep(path,
          '''    return this.resolveWithFingerprint("ranked_result", safe.operationId, safe.actorId, safe.tableId, canonicalStringify(safe), () => {\n      this.assertAssignedArbitrator(safe.tableId, safe.actorId);\n      if (!this.hasStoredMainEvidence(safe.tableId)) throw new RankedDisputeError("ERR_DISPUTE_INSUFFICIENT_EVIDENCE", "ranked result arbitration requires stored main evidence");\n      const table = this.requireTable(safe.tableId);\n      if (table.state !== "disputed") throw new RankedDisputeError("ERR_DISPUTE_NOT_OPEN", "table is not disputed", { state: table.state });''',
          '''    return this.resolveWithFingerprint("ranked_result", safe.operationId, safe.actorId, safe.tableId, canonicalStringify(safe), () => {\n      this.assertAssignedArbitrator(safe.tableId, safe.actorId);\n      const table = this.requireTable(safe.tableId);\n      if (table.state !== "disputed") throw new RankedDisputeError("ERR_DISPUTE_NOT_OPEN", "table is not disputed", { state: table.state });\n      if (this.isPreStartDispute(table)) {\n        throw new RankedDisputeError("ERR_DISPUTE_PRE_START_RESULT", "pre-start dispute cannot be resolved as a ranked result", {\n          tableId: safe.tableId,\n        });\n      }\n      if (!this.hasStoredMainEvidence(safe.tableId)) throw new RankedDisputeError("ERR_DISPUTE_INSUFFICIENT_EVIDENCE", "ranked result arbitration requires stored main evidence");''')

          old_deadline = '''        const closeTx = this.db.transaction((): "closed" | "needs_refund" | "skip" => {\n          this.ensureSchemaForFormal();\n          const table = this.requireTable(row.table_id);\n          if (table.state !== "disputed") return "skip";\n          const dispute = this.requireDispute(row.table_id);\n          if (dispute.resolved_at !== null || dispute.evidence_closed_at !== null || dispute.evidence_deadline_at > now) return "skip";\n          if (!this.hasStoredMainEvidence(row.table_id)) return "needs_refund";\n          const changed = this.db\n            .prepare(\n              `UPDATE casino_table_disputes\n                 SET evidence_closed_at=?, status='awaiting_arbitration'\n               WHERE table_id=? AND resolved_at IS NULL AND evidence_closed_at IS NULL`,\n            )\n            .run(now, row.table_id).changes;\n          if (changed !== 1) throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "evidence close race", { tableId: row.table_id });\n          this.db.prepare("UPDATE casino_tables SET deadline_at=NULL, updated_at=? WHERE table_id=? AND state='disputed'").run(now, row.table_id);\n          return "closed";\n        });\n        const closeResult = this.db.inTransaction ? closeTx() : closeTx.immediate();\n        if (closeResult === "closed") {\n          closed++;\n          continue;\n        }\n        if (closeResult === "skip") continue;\n        const dispute = this.requireDispute(row.table_id);\n        const op = `evidence-timeout:${row.table_id}:${dispute.evidence_deadline_at}`;\n        const fingerprint = canonicalStringify({ tableId: row.table_id, op, kind: "insufficient_evidence" });\n        this.resolveWithFingerprint("insufficient_evidence", op, "system:ranked-evidence-timeout", row.table_id, fingerprint, () => {\n          const current = this.requireTable(row.table_id);\n          const currentDispute = this.requireDispute(row.table_id);\n          if (current.state !== "disputed" || currentDispute.resolved_at !== null || currentDispute.evidence_closed_at !== null || currentDispute.evidence_deadline_at > now) {\n            throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "deadline resolution race", { tableId: row.table_id });\n          }\n          if (this.hasStoredMainEvidence(row.table_id)) {\n            throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "stored main evidence won the deadline race", { tableId: row.table_id });\n          }\n          this.refundCollateralAndFinalize(current, "system:ranked-evidence-timeout", "keep", "cancelled", "insufficient_evidence", "insufficient evidence", op, fingerprint);\n        });\n        autoRefunded++;'''
          new_deadline = '''        const closeTx = this.db.transaction((): "closed" | "needs_refund" | "needs_pre_start_refund" | "skip" => {\n          this.ensureSchemaForFormal();\n          const table = this.requireTable(row.table_id);\n          if (table.state !== "disputed") return "skip";\n          const dispute = this.requireDispute(row.table_id);\n          if (dispute.resolved_at !== null || dispute.evidence_closed_at !== null || dispute.evidence_deadline_at > now) return "skip";\n          // A recovery dispute whose game never started must never be held indefinitely by evidence.\n          // started_at/fee_committed_at are canonical start boundaries: either missing means all active\n          // escrow rows are still pre-start collateral and must be returned in full at the deadline.\n          if (this.isPreStartDispute(table)) return "needs_pre_start_refund";\n          if (!this.hasStoredMainEvidence(row.table_id)) return "needs_refund";\n          const changed = this.db\n            .prepare(\n              `UPDATE casino_table_disputes\n                 SET evidence_closed_at=?, status='awaiting_arbitration'\n               WHERE table_id=? AND resolved_at IS NULL AND evidence_closed_at IS NULL`,\n            )\n            .run(now, row.table_id).changes;\n          if (changed !== 1) throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "evidence close race", { tableId: row.table_id });\n          this.db.prepare("UPDATE casino_tables SET deadline_at=NULL, updated_at=? WHERE table_id=? AND state='disputed'").run(now, row.table_id);\n          this.queueMessageSync(row.table_id);\n          return "closed";\n        });\n        const closeResult = this.db.inTransaction ? closeTx() : closeTx.immediate();\n        if (closeResult === "closed") {\n          closed++;\n          continue;\n        }\n        if (closeResult === "skip") continue;\n        const preStart = closeResult === "needs_pre_start_refund";\n        const dispute = this.requireDispute(row.table_id);\n        const kind: RankedResolutionKind = preStart ? "refund_collateral" : "insufficient_evidence";\n        const op = `${preStart ? "pre-start-timeout" : "evidence-timeout"}:${row.table_id}:${dispute.evidence_deadline_at}`;\n        const fingerprint = canonicalStringify({ tableId: row.table_id, op, kind });\n        this.resolveWithFingerprint(kind, op, "system:ranked-evidence-timeout", row.table_id, fingerprint, () => {\n          const current = this.requireTable(row.table_id);\n          const currentDispute = this.requireDispute(row.table_id);\n          if (current.state !== "disputed" || currentDispute.resolved_at !== null || currentDispute.evidence_closed_at !== null || currentDispute.evidence_deadline_at > now) {\n            throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "deadline resolution race", { tableId: row.table_id });\n          }\n          if (preStart) {\n            if (!this.isPreStartDispute(current)) {\n              throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "pre-start dispute changed before deadline refund", { tableId: row.table_id });\n            }\n          } else if (this.hasStoredMainEvidence(row.table_id)) {\n            throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "stored main evidence won the deadline race", { tableId: row.table_id });\n          }\n          this.refundCollateralAndFinalize(\n            current,\n            "system:ranked-evidence-timeout",\n            "keep",\n            "cancelled",\n            kind,\n            preStart ? "対局開始前のため預託を全額返金" : "証拠不足",\n            op,\n            fingerprint,\n          );\n        });\n        autoRefunded++;'''
          rep(path, old_deadline, new_deadline)

          old_status = '''  publicStatus(tableId: string): RankedDisputePublicStatus | null {\n    if (!this.hasSchema()) return null;\n    const row = this.readDispute(tableId);\n    if (!row) return null;\n    return {\n      tableId: row.table_id,\n      evidenceDeadlineAt: row.evidence_deadline_at,\n      evidenceClosedAt: row.evidence_closed_at,\n      assignedArbitratorId: row.assigned_arbitrator_id,\n      resolutionKind: row.resolution_kind,\n      feeOutcome: row.fee_outcome,\n      recordStats: row.record_stats === null ? null : row.record_stats === 1,\n      publicSummary: row.public_summary,\n      resolvedBy: row.resolved_by,\n      resolvedAt: row.resolved_at,\n    };\n  }\n\n  recordUnanimousMatch'''
          new_status = '''  publicStatus(tableId: string): RankedDisputePublicStatus | null {\n    if (!this.hasSchema()) return null;\n    const row = this.readDispute(tableId);\n    if (!row) return null;\n    const table = this.requireTable(tableId);\n    return {\n      tableId: row.table_id,\n      evidenceDeadlineAt: row.evidence_deadline_at,\n      evidenceClosedAt: row.evidence_closed_at,\n      preStart: this.isPreStartDispute(table),\n      refundAmounts: this.resolutionRefunds(row),\n      assignedArbitratorId: row.assigned_arbitrator_id,\n      resolutionKind: row.resolution_kind,\n      feeOutcome: row.fee_outcome,\n      recordStats: row.record_stats === null ? null : row.record_stats === 1,\n      publicSummary: row.public_summary,\n      resolvedBy: row.resolved_by,\n      resolvedAt: row.resolved_at,\n    };\n  }\n\n  private resolutionRefunds(row: DisputeRow): RankedRefundReceipt[] | null {\n    if (row.resolved_at === null || row.resolution_kind === "ranked_result") return null;\n    if (!row.resolution_operation_id) {\n      throw new RankedDisputeError("ERR_DISPUTE_RESOLUTION_CONFLICT", "resolved refund is missing operation id", { tableId: row.table_id });\n    }\n    const groupKey = `ranked:dispute:${row.table_id}:${row.resolution_operation_id}`;\n    const txRows = this.db\n      .prepare(\n        `SELECT to_holder, amount\n           FROM casino_tx\n          WHERE group_key=? AND session_id=? AND from_holder=? AND tx_kind='internal_transfer'\n          ORDER BY id`,\n      )\n      .all(groupKey, row.table_id, escrowHolderFor(row.table_id)) as Array<{ to_holder: string | null; amount: number }>;\n    const byUser = new Map<string, number>();\n    for (const tx of txRows) {\n      if (!tx.to_holder || !Number.isSafeInteger(tx.amount) || tx.amount <= 0) {\n        throw new RankedDisputeError("ERR_DISPUTE_ESCROW_MISMATCH", "refund receipt transaction is corrupt", { tableId: row.table_id, tx });\n      }\n      const next = (byUser.get(tx.to_holder) ?? 0) + tx.amount;\n      if (!Number.isSafeInteger(next)) throw new RankedDisputeError("ERR_DISPUTE_ESCROW_MISMATCH", "refund receipt overflow", { tableId: row.table_id });\n      byUser.set(tx.to_holder, next);\n    }\n    const active = this.activeParticipants(row.table_id);\n    if (byUser.size !== active.length || active.some((participant) => !byUser.has(participant.userId))) {\n      throw new RankedDisputeError("ERR_DISPUTE_ESCROW_MISMATCH", "refund receipt participants do not match the table", {\n        tableId: row.table_id,\n        receiptUsers: [...byUser.keys()],\n        activeUsers: active.map((participant) => participant.userId),\n      });\n    }\n    return active\n      .slice()\n      .sort((a, b) => a.seat - b.seat)\n      .map((participant) => ({ userId: participant.userId, amount: byUser.get(participant.userId)! }));\n  }\n\n  recordUnanimousMatch'''
          rep(path, old_status, new_status)

          rep(path,
          '''    this.db.prepare("UPDATE casino_tables SET deadline_at=NULL, updated_at=? WHERE table_id=?").run(this.now(), tableId);\n    this.events.log("casino_ranked_dispute_resolved", {''',
          '''    this.db.prepare("UPDATE casino_tables SET deadline_at=NULL, updated_at=? WHERE table_id=?").run(this.now(), tableId);\n    this.queueMessageSync(tableId);\n    this.events.log("casino_ranked_dispute_resolved", {''')

          rep(path,
          '''    this.ensureMatchHistorySchema();\n  }\n\n  private ensureSchemaForFormal''',
          '''    this.ensureMatchHistorySchema();\n    this.ensureMessageSyncSchema();\n  }\n\n  private ensureSchemaForFormal''')

          rep(path,
          '''  private migrateSchema(): void {\n    this.addColumnIfMissing("casino_table_evidence", "metadata_json", "TEXT");\n  }\n\n  private addColumnIfMissing''',
          '''  private migrateSchema(): void {\n    this.addColumnIfMissing("casino_table_evidence", "metadata_json", "TEXT");\n    this.ensureMessageSyncSchema();\n  }\n\n  private ensureMessageSyncSchema(): void {\n    this.db.exec(`\n      CREATE TABLE IF NOT EXISTS casino_table_message_sync_outbox (\n        table_id TEXT PRIMARY KEY,\n        requested_at INTEGER NOT NULL,\n        attempts INTEGER NOT NULL DEFAULT 0 CHECK(attempts >= 0),\n        last_attempt_at INTEGER,\n        last_error TEXT,\n        FOREIGN KEY(table_id) REFERENCES casino_tables(table_id) ON DELETE CASCADE\n      );\n    `);\n  }\n\n  private queueMessageSync(tableId: string): void {\n    this.ensureMessageSyncSchema();\n    this.db\n      .prepare(\n        `INSERT INTO casino_table_message_sync_outbox\n           (table_id, requested_at, attempts, last_attempt_at, last_error)\n         VALUES (?, ?, 0, NULL, NULL)\n         ON CONFLICT(table_id) DO UPDATE SET requested_at=excluded.requested_at`,\n      )\n      .run(tableId, this.now());\n  }\n\n  private addColumnIfMissing''')

          # opening reset classification: make the new table known and R6-resettable.
          path = "packages/core/src/casino/opening-tables.ts"
          marker = '''  T({\n    table: "casino_ranked_match_history",\n    purpose: "Ranked PvP match-history records separate from casino_stats",\n    kind: "optional_feature",\n    archive: true,\n    resetOnApply: true,\n    resetPhase: "R6",\n    preserve: false,\n    blockerCondition: "none",\n    rationale:\n      "ranked-disputes.ts records unanimous/arbitrated ranked match history without overloading casino_stats. Pre-opening rows are reset in R6.",\n  }),'''
          addition = marker + '''\n  T({\n    table: "casino_table_message_sync_outbox",\n    purpose: "Durable retry queue for canonical Discord ranked-table message synchronization",\n    kind: "optional_feature",\n    archive: true,\n    resetOnApply: true,\n    resetPhase: "R6",\n    preserve: false,\n    blockerCondition: "none",\n    rationale:\n      "ranked-disputes.ts records non-financial Discord message-sync work here in the same commit as dispute/public-state changes. It is formal-era transient metadata and is reset in R6.",\n  }),'''
          rep(path, marker, addition)

          # bot renderer + durable edit acknowledgement/retry
          path = "apps/bot/src/casino/ranked-table-ui.ts"
          rep(path,
          '''import type { RankedTableSnapshot } from "@meigokujo/core";\nimport type { RankedDisputePublicStatus } from "@meigokujo/core";''',
          '''import { rankedReceipts, type RankedDisputePublicStatus, type RankedTableSnapshot } from "@meigokujo/core";''')

          old_resolved = '''  if (dispute?.resolvedAt) {\n    lines.push(`arbitration: ${resolutionLabel(dispute.resolutionKind)} / fee ${dispute.feeOutcome ?? "keep"}`);\n    lines.push(`resolved by: ${dispute.resolvedBy ?? "unknown"} / <t:${dispute.resolvedAt}:f>`);\n    if (dispute.publicSummary) lines.push(`summary: ${dispute.publicSummary}`);\n    lines.push("public summary does not include raw evidence, URLs, attachments, testimony details, or external account information.");\n  } else if (table.state === "disputed") {\n    if (dispute?.resolvedAt) {\n      lines.push(`裁定: ${resolutionLabel(dispute.resolutionKind)} / fee ${dispute.feeOutcome ?? "keep"}`);\n      if (dispute.publicSummary) lines.push(`要約: ${dispute.publicSummary}`);\n    } else {\n      lines.push(`証拠期限: ${dispute ? `<t:${dispute.evidenceDeadlineAt}:R>` : "確認中"}`);\n      lines.push(dispute?.evidenceClosedAt ? "証拠提出は締切済み。裁定待ちです。" : "`/賭場証拠 提出` で証拠を提出できます。");\n    }\n  }'''
          new_resolved = '''  if (dispute?.resolvedAt) {\n    lines.push(`裁定: ${resolutionLabel(dispute.resolutionKind)}`);\n    if (dispute.resolutionKind === "ranked_result") {\n      if (!result) throw new Error(`resolved ranked table is missing canonical result: ${table.tableId}`);\n      const receipts = rankedReceipts(config.profile, config.baseAmount);\n      lines.push("分配:");\n      result.orderedUserIds.forEach((userId, index) => {\n        lines.push(`${index + 1}位 <@${userId}> — ${receipts[index]!.toLocaleString("ja-JP")} Ld`);\n      });\n    } else {\n      const refunds = dispute.refundAmounts;\n      if (!refunds || refunds.length !== active.length) {\n        throw new Error(`resolved refund is missing canonical refund receipts: ${table.tableId}`);\n      }\n      const refundByUser = new Map(refunds.map((refund) => [refund.userId, refund.amount]));\n      lines.push("返金:");\n      for (const participant of active.slice().sort((a, b) => a.seat - b.seat)) {\n        const amount = refundByUser.get(participant.userId);\n        if (amount === undefined) throw new Error(`resolved refund receipt is missing participant: ${participant.userId}`);\n        lines.push(`<@${participant.userId}> — ${amount.toLocaleString("ja-JP")} Ld`);\n      }\n    }\n    lines.push(`場代: ${feeOutcomeLabel(dispute)}`);\n    lines.push(`理由: ${dispute.publicSummary ?? "理由なし"}`);\n    lines.push(`裁定者: ${actorLabel(dispute.resolvedBy)}`);\n    lines.push(`日時: <t:${dispute.resolvedAt}:f>`);\n  } else if (table.state === "disputed") {\n    lines.push(`証拠期限: ${dispute ? `<t:${dispute.evidenceDeadlineAt}:R>` : "確認中"}`);\n    lines.push(dispute?.evidenceClosedAt ? "証拠提出は締切済み。裁定待ちです。" : "`/賭場証拠 提出` で証拠を提出できます。");\n  }'''
          rep(path, old_resolved, new_resolved)

          rep(path,
          '''  await interaction.update({ content, ...payload }).catch(async () => {\n    await interaction.reply({ content, ephemeral: true });\n  });''',
          '''  try {\n    await interaction.update({ content, ...payload });\n    services.rankedDisputes.markMessageSyncSucceeded(tableId);\n  } catch {\n    await interaction.reply({ content, ephemeral: true });\n  }''')

          old_edit = '''export async function editBoundRankedTableMessage(client: Client, services: Services, tableId: string): Promise<void> {\n  const snapshot = services.rankedTables.snapshot(tableId);\n  const { table } = snapshot;\n  if (!table.channelId || !table.messageId) return;\n  try {\n    const channel = client.channels.cache.get(table.channelId) ?? await client.channels.fetch(table.channelId);\n    const textChannel = channel as { messages?: { fetch(id: string): Promise<{ edit(payload: unknown): Promise<unknown> }> } } | null;\n    const message = await textChannel?.messages?.fetch(table.messageId);\n    await message?.edit(renderRankedTable(snapshot, services.rankedDisputes.publicStatus(tableId)));\n  } catch (e) {\n    services.events.log("casino_ranked_message_edit_failed", {\n      actor: "system:ranked-ui",\n      target: tableId,\n      payload: { channelId: table.channelId, messageId: table.messageId, error: e instanceof Error ? e.message : String(e) },\n    });\n  }\n}\n'''
          new_edit = '''export async function editBoundRankedTableMessage(client: Client, services: Services, tableId: string): Promise<boolean> {\n  let snapshot: RankedTableSnapshot;\n  try {\n    snapshot = services.rankedTables.snapshot(tableId);\n  } catch (e) {\n    services.rankedDisputes.markMessageSyncFailed(tableId, e);\n    return false;\n  }\n  const { table } = snapshot;\n  if (!table.channelId || !table.messageId) {\n    services.rankedDisputes.markMessageSyncFailed(tableId, new Error("ranked table has no canonical Discord message binding"));\n    return false;\n  }\n  try {\n    const channel = client.channels.cache.get(table.channelId) ?? await client.channels.fetch(table.channelId);\n    const textChannel = channel as { messages?: { fetch(id: string): Promise<{ edit(payload: unknown): Promise<unknown> }> } } | null;\n    if (!textChannel?.messages?.fetch) throw new Error("ranked table channel is not message-fetchable");\n    const message = await textChannel.messages.fetch(table.messageId);\n    if (!message?.edit) throw new Error("ranked table canonical message is not editable");\n    await message.edit(renderRankedTable(snapshot, services.rankedDisputes.publicStatus(tableId)));\n    services.rankedDisputes.markMessageSyncSucceeded(tableId);\n    return true;\n  } catch (e) {\n    services.rankedDisputes.markMessageSyncFailed(tableId, e);\n    services.events.log("casino_ranked_message_edit_failed", {\n      actor: "system:ranked-ui",\n      target: tableId,\n      payload: { channelId: table.channelId, messageId: table.messageId, error: e instanceof Error ? e.message : String(e) },\n    });\n    return false;\n  }\n}\n\nexport async function retryPendingRankedTableMessages(\n  client: Client,\n  services: Services,\n): Promise<{ attempted: number; synced: number; failed: number }> {\n  const pending = services.rankedDisputes.listMessageSyncPending();\n  let synced = 0;\n  for (const row of pending) {\n    if (await editBoundRankedTableMessage(client, services, row.tableId)) synced++;\n  }\n  return { attempted: pending.length, synced, failed: pending.length - synced };\n}\n'''
          rep(path, old_edit, new_edit)

          rep(path,
          '''function resolutionLabel(kind: string | null): string {\n  if (kind === "ranked_result") return "順位確定";\n  if (kind === "refund_collateral") return "預託返金";\n  if (kind === "insufficient_evidence") return "証拠不足";\n  return "未確定";\n}\n''',
