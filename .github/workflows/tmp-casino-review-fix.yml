name: Temporary Casino Review Fix

on:
  push:
    branches: ["feat/casino-auto-chip-flow"]
    paths: [".github/workflows/tmp-casino-review-fix.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casino-auto-chip-flow
          fetch-depth: 0
      - name: Remove legacy root export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/core/src/index.ts')
          text = path.read_text(encoding='utf-8')
          old = '  /** @deprecated compatibility export; use ChipLedger. */\n  EtherExchange,\n'
          if old not in text:
              raise SystemExit('legacy root export marker not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-casino-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/index.ts
          git commit -m "fix(casino): hide legacy exchange API"
          git push origin HEAD:feat/casino-auto-chip-flow
