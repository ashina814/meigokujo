name: Temporary Casino Review Fix

on:
  push:
    branches: ["feat/casino-remittance"]
    paths: [".github/workflows/tmp-casino-review-fix.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casino-remittance
          fetch-depth: 0
      - name: Apply reviewed finance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('packages/core/src/index.ts')
          text = index.read_text(encoding='utf-8')
          old_export = '  /** @deprecated compatibility export; use ChipLedger. */\n  EtherExchange,\n'
          if old_export not in text:
              raise SystemExit('legacy root export marker not found')
          index.write_text(text.replace(old_export, '', 1), encoding='utf-8')

          remittance = Path('packages/core/src/casino/remittance.ts')
          text = remittance.read_text(encoding='utf-8')
          replacements = [
              ('ORDER BY t.group_key, t.seq, t.id', 'ORDER BY t.created_at, t.id'),
              ('? "SELECT * FROM casino_house_pnl WHERE period=? ORDER BY id"\n      : "SELECT * FROM casino_house_pnl ORDER BY id";',
               '? "SELECT * FROM casino_house_pnl WHERE period=? ORDER BY created_at, id"\n      : "SELECT * FROM casino_house_pnl ORDER BY created_at, id";'),
              ('  draft(\n    key: string,', '  private draftConfigured(\n    key: string,'),
              ('    return this.draft(key, config.remittanceBps, config.minimumWorkingCapital, actor, options);',
               '    return this.draftConfigured(key, config.remittanceBps, config.minimumWorkingCapital, actor, options);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'remittance marker not found: {old[:80]}')
              text = text.replace(old, new, 1)
          guard_marker = '  private draftConfigured(\n    key: string,\n    bps: number,\n    minimumWorkingCapital: number,\n    actor: string,\n    options: RemittanceDraftOptions = {},\n  ): RemittanceRow {\n'
          guard = guard_marker + '    const configured = this.configuration();\n    if (\n      !configured\n      || configured.remittanceBps !== bps\n      || configured.minimumWorkingCapital !== minimumWorkingCapital\n    ) {\n      throw new Error("remittance draft must use opening configuration");\n    }\n'
          if guard_marker not in text:
              raise SystemExit('draft configuration guard marker not found')
          text = text.replace(guard_marker, guard, 1)
          remittance.write_text(text, encoding='utf-8')

          tests = Path('packages/core/tests/casino-remittance.test.ts')
          text = tests.read_text(encoding='utf-8')
          count = text.count('c.remit.draft(') + text.count('d.remit.draft(')
          if count < 10:
              raise SystemExit(f'unexpected direct draft call count: {count}')
          text = text.replace('c.remit.draft(', 'createRemittanceDraft(c, ')
          text = text.replace('d.remit.draft(', 'createRemittanceDraft(d, ')
          marker = 'function openFormally(c: ReturnType<typeof setup>): void {'
          helper = '''function createRemittanceDraft(\n  c: ReturnType<typeof setup>,\n  key: string,\n  bps: number,\n  minimumWorkingCapital: number,\n  actor: string,\n  options: { period?: string; fukuReserve?: number } = {},\n) {\n  configureOpening(c, { bps, minimumWorkingCapital });\n  return c.remit.draftFromConfiguration(key, actor, options);\n}\n\n'''
          if marker not in text:
              raise SystemExit('test helper insertion marker not found')
          text = text.replace(marker, helper + marker, 1)
          api_marker = '  it("納付率と最低運転資金を開業設定だけから読む", () => {\n    const c = setup();\n'
          api_replacement = api_marker + '    expect((c.remit as unknown as { draft?: unknown }).draft).toBeUndefined();\n'
          if api_marker not in text:
              raise SystemExit('public API assertion marker not found')
          text = text.replace(api_marker, api_replacement, 1)
          tests.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/tmp-casino-review-fix.yml
          if [ -f .github/workflows/fix-pr13-chinchiro-text.yml ]; then
            git rm .github/workflows/fix-pr13-chinchiro-text.yml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/index.ts packages/core/src/casino/remittance.ts packages/core/tests/casino-remittance.test.ts
          git commit -m "fix(casino): enforce configured remittance drafts"
          git push origin HEAD:feat/casino-remittance
